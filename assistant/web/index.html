<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星期五 · FRIDAY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%235eead4'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='white' font-family='Microsoft YaHei,sans-serif' font-weight='700'%3E%E4%BA%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="orb" aria-hidden="true"></canvas>
<div class="css-orb" id="cssOrb" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grid-floor" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">五</span>
    <div>
      <div class="brand-name">FRIDAY</div>
      <div class="brand-sub">星期五 · 私人 AI 助手</div>
    </div>
  </div>
  <div class="status-pill" id="modePill"><span class="dot"></span><span id="modeText">待机 STANDBY</span></div>
  <div class="clock">
    <div id="clockTime">--:--:--</div>
    <div id="clockDate" class="clock-date">----</div>
  </div>
</header>

<aside class="hud hud-left">
  <section class="panel">
    <h2><span>SYSTEM</span>系统</h2>
    <ul class="sys" id="sysList"></ul>
    <label class="bright">亮度 <input type="range" id="brightness" min="20" max="120" step="5" value="70" aria-label="光球亮度"><output id="brightOut">70%</output></label>
    <div class="update-row"><span>版本 <b id="versionText">—</b></span><button type="button" class="mini-btn" id="updateBtn" title="从 GitHub 下载最新的星期五并自动重启">检查更新</button></div>
  </section>
  <section class="panel grow">
    <h2><span>MEMORY</span>我记得的事</h2>
    <ul class="list" id="memoryList"><li class="empty">还没有记忆</li></ul>
  </section>
</aside>

<aside class="hud hud-right">
  <section class="panel">
    <h2><span>REMINDERS</span>提醒</h2>
    <ul class="list" id="reminderList"><li class="empty">没有提醒</li></ul>
  </section>
  <section class="panel grow">
    <h2><span>TASKS</span>待办</h2>
    <ul class="list" id="todoList"><li class="empty">没有待办</li></ul>
  </section>
</aside>

<main class="console">
  <div class="banner" id="banner" hidden></div>
  <div class="log" id="log" aria-live="polite"></div>
  <form class="inputbar" id="form" autocomplete="off">
    <button type="button" class="icon-btn mic" id="micBtn" title="语音输入(说完停顿 2 秒自动结束)" aria-label="语音输入">
      <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
    </button>
    <input id="input" type="text" placeholder="对星期五说点什么……(回车发送)" maxlength="4000">
    <button type="submit" class="send" id="sendBtn">发送 <span>SEND</span></button>
    <button type="button" class="icon-btn toggle" id="speakBtn" title="朗读回答" aria-label="朗读回答" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12"/></svg>
    </button>
    <button type="button" class="icon-btn" id="clearBtn" title="开始新话题" aria-label="开始新话题">
      <svg viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M20 12a8 8 0 1 1-2.3-5.7L4 10"/></svg>
    </button>
    <button type="button" class="icon-btn power" id="powerBtn" title="关闭星期五(后台也会停止)" aria-label="关闭星期五">
      <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
    </button>
  </form>
  <div class="hint">关掉这个窗口后,星期五仍在后台运行(手机 Discord、提醒照常)。点右边的电源按钮才会完全退出。</div>
</main>

<div class="modal" id="approval" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="approvalTitle">
    <div class="modal-head"><span class="glitch" id="approvalTitle" data-text="AUTHORIZATION">AUTHORIZATION</span>授权请求</div>
    <pre class="modal-body" id="approvalText"></pre>
    <div class="modal-actions">
      <button class="btn ok" id="approveYes">允许</button>
      <button class="btn" id="approveNo">拒绝</button>
      <button class="btn ghost" id="approveAll">本次运行都允许</button>
    </div>
    <div class="modal-note" id="approvalNote"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
